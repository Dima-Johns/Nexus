<div class="login-watermark" id="login-mark" aria-hidden="true">Nexus</div>
<div class="login-card">
  <div class="login-corner">
    <div id="login-lang"></div>
    <button class="icon-btn theme-fab" type="button" id="login-theme" data-theme-toggle title="Kun rejimi">☀</button>
  </div>
  <h1>Login</h1>
  <p class="muted login-sub">Dispatcher panel</p>
  <label class="sr-only" for="login-org">Tashkilot kodi</label>
  <input id="login-org" class="org-code-input" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="Secret code" autocomplete="organization" title="Tashkilot kodi" />
  <label class="sr-only" for="login-user">Login</label>
  <input id="login-user" placeholder="Login" autocomplete="username" />
  <label class="sr-only" for="login-pass">Parol</label>
  <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
  <div class="login-foot">
    <label class="chk remember-row">
      <input type="checkbox" id="login-remember" />
      Remember me
    </label>
    <button class="btn primary login-enter" id="login-btn" type="button">Enter</button>
  </div>
  <p id="login-error" class="error"></p>
</div>
