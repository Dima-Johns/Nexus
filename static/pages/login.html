<div class="login-watermark" aria-hidden="true">Nexus</div>
<div class="glass login-card">
  <button class="icon-btn theme-fab" type="button" id="login-theme" data-theme-toggle title="Kun rejimi">☀</button>
  <div class="login-logo" aria-hidden="true">
    <span class="login-logo-tile"><img src="/static/brand/nexus-logo.webp" alt="" /><i></i></span>
  </div>
  <p class="eyebrow">NEXUS · LOGISTIKA</p>
  <h1>Tizimga kirish</h1>
  <p class="muted">API asosidagi dispetcher paneli</p>
  <label>Tashkilot kodi</label>
  <input id="login-org" class="org-code-input" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="6 xonali kod · superadmin uchun shart emas" autocomplete="organization" />
  <label>Login</label>
  <input id="login-user" autocomplete="username" />
  <label>Parol</label>
  <input id="login-pass" type="password" autocomplete="current-password" />
  <label class="chk remember-row">
    <input type="checkbox" id="login-remember" />
    Parolni eslab qolish
  </label>
  <button class="btn primary" id="login-btn">Kirish</button>
  <p id="login-error" class="error"></p>
</div>
